<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DARK DILA-MD | Pairing</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;min-height:100vh;padding:25px 15px;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at top,#12352c,#080d12 55%);
    color:#fff;font-family:Arial,sans-serif
}
.card{
    width:100%;max-width:430px;padding:30px 23px;
    border:1px solid #245b49;border-radius:22px;
    background:rgba(10,20,22,.95);
    box-shadow:0 15px 60px #0009;text-align:center
}
.logo{
    width:75px;height:75px;margin:auto auto 15px;
    border-radius:22px;background:#123c2e;
    display:grid;place-items:center;font-size:27px;
    font-weight:bold;color:#46e6a0;
    border:1px solid #32865f
}
h1{font-size:25px;margin:8px 0}
.green{color:#43e69b}
.sub{color:#9aaca7;font-size:13px;line-height:1.6}
input{
    width:100%;padding:15px;margin:10px 0;
    background:#101c1d;border:1px solid #315348;
    color:white;border-radius:10px;font-size:15px;outline:none
}
button{
    width:100%;padding:15px;margin-top:10px;
    border:0;border-radius:10px;background:#20bd78;
    color:#06130d;font-weight:bold;font-size:15px;
    cursor:pointer
}
button:disabled{opacity:.5;cursor:not-allowed}
.result{
    display:none;margin-top:20px;padding:17px;
    border-radius:12px;background:#122522;
    border:1px solid #285d49
}
.code{font-size:27px;letter-spacing:5px;color:#51eaa4;font-weight:bold;margin:12px 0}
.status{font-size:13px;color:#b8cbc3;line-height:1.6}
.copy{background:#234a3a;color:#fff}
.session{
    width:100%;min-height:100px;resize:vertical;
    background:#0a1715;color:#65e9a7;border:1px solid #315348;
    border-radius:9px;padding:10px;margin-top:12px;word-break:break-all
}
.footer{margin-top:25px;color:#6e8580;font-size:11px}
</style>
</head>
<body>
<div class="card">
    <div class="logo">DD</div>
    <h1>DARK DILA <span class="green">MD</span></h1>
    <p class="sub">WHATSAPP PAIRING SYSTEM<br>Secure Session Generator</p>

    <input id="accessKey" type="password" placeholder="Website Access Key">
    <input id="number" type="tel" placeholder="WhatsApp Number (e.g. 947XXXXXXXX)">

    <button id="startBtn" onclick="startPair()">GET PAIR CODE</button>

    <div class="result" id="result">
        <p class="sub">YOUR PAIR CODE</p>
        <div class="code" id="pairCode">--------</div>
        <button class="copy" onclick="copyCode()">COPY PAIR CODE</button>
        <p class="status" id="status">Waiting...</p>
        <p class="sub">
            WhatsApp → Linked Devices → Link with phone number instead
        </p>
        <div id="sessionArea" style="display:none">
            <p class="green">SESSION ID GENERATED</p>
            <textarea class="session" id="sessionId" readonly></textarea>
            <button class="copy" onclick="copySession()">COPY SESSION ID</button>
        </div>
    </div>

    <p class="footer">© DARK DILA-MD | POWERED BY DARK DILA-MD</p>
</div>

<script>
let jobId = null;
let pollTimer = null;

async function api(url, options = {}) {
    const key = document.getElementById("accessKey").value.trim();

    const response = await fetch(url, {
        ...options,
        headers: {
            "Content-Type": "application/json",
            "x-pair-key": key,
            ...(options.headers || {})
        }
    });

    const data = await response.json();

    if (!response.ok) {
        throw new Error(data.error || "Request failed");
    }

    return data;
}

async function startPair() {
    const number = document.getElementById("number").value.replace(/\D/g, "");
    const button = document.getElementById("startBtn");
    const result = document.getElementById("result");

    if (!document.getElementById("accessKey").value.trim()) {
        alert("Enter the Website Access Key.");
        return;
    }

    if (!/^\d{8,15}$/.test(number)) {
        alert("Enter a valid number with country code.");
        return;
    }

    button.disabled = true;
    button.textContent = "GENERATING...";
    result.style.display = "block";
    document.getElementById("pairCode").textContent = "WAIT...";
    document.getElementById("status").textContent = "Connecting to WhatsApp...";
    document.getElementById("sessionArea").style.display = "none";

    try {
        const data = await api("/api/pair", {
            method: "POST",
            body: JSON.stringify({ number })
        });

        jobId = data.id;
        document.getElementById("pairCode").textContent = data.code || "NOT READY";
        document.getElementById("status").textContent = data.message;

        if (data.status === "error") {
            throw new Error(data.error || data.message);
        }

        pollTimer = setInterval(checkStatus, 3000);

    } catch (error) {
        document.getElementById("status").textContent = error.message;
        button.disabled = false;
        button.textContent = "TRY AGAIN";
    }
}

async function checkStatus() {
    if (!jobId) return;

    try {
        const data = await api("/api/status/" + encodeURIComponent(jobId));

        document.getElementById("status").textContent = data.message;

        if (data.status === "success" && data.sessionId) {
            document.getElementById("sessionId").value = data.sessionId;
            document.getElementById("sessionArea").style.display = "block";
            finishPolling("SESSION READY");
        }

        if (data.status === "error") {
            document.getElementById("status").textContent =
                data.error || data.message;
            finishPolling("TRY AGAIN");
        }
    } catch (error) {
        document.getElementById("status").textContent = error.message;
        finishPolling("TRY AGAIN");
    }
}

function finishPolling(label) {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = null;
    document.getElementById("startBtn").disabled = false;
    document.getElementById("startBtn").textContent = label;
}

async function copyCode() {
    await navigator.clipboard.writeText(
        document.getElementById("pairCode").textContent
    );
    alert("Pair Code copied.");
}

async function copySession() {
    await navigator.clipboard.writeText(
        document.getElementById("sessionId").value
    );
    alert("Session ID copied. Keep it private.");
}
</script>
</body>
</html>
