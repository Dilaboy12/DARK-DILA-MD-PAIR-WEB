name: DARK DILA-MD PAIR SESSION

on:
  workflow_dispatch:
    inputs:
      PAIRING_NUMBER:
        description: "WhatsApp Pairing Number (Without +)"
        required: true
        type: string

      OWNER_NUMBER:
        description: "Bot Owner Number (Without +)"
        required: true
        type: string

      MEGA_EMAIL:
        description: "MEGA Account Email"
        required: true
        type: string

      MEGA_PASSWORD:
        description: "MEGA Account Password"
        required: true
        type: string

jobs:
  pair:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PAIRING_NUMBER: ${{ inputs.PAIRING_NUMBER }}
      OWNER_NUMBER: ${{ inputs.OWNER_NUMBER }}
      MEGA_EMAIL: ${{ inputs.MEGA_EMAIL }}
      MEGA_PASSWORD: ${{ inputs.MEGA_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Inputs
        run: |
          echo "================================"
          echo "       DARK DILA-MD"
          echo "================================"

          for key in PAIRING_NUMBER OWNER_NUMBER MEGA_EMAIL MEGA_PASSWORD
          do
            if [ -z "${!key}" ]; then
              echo "[START ERROR] $key is missing!"
              exit 1
            fi
          done

          echo "All required inputs received."
          echo "Pairing number: ${PAIRING_NUMBER}"
          echo "Owner number: ${OWNER_NUMBER}"
          echo "MEGA credentials: Received"

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Start Pair Session
        run: npm start
