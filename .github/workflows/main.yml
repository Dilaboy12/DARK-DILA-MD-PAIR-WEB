name: DARK DILA-MD PAIR

on:
  workflow_dispatch:
    inputs:
      owner_number:
        description: "Owner WhatsApp Number (with country code)"
        required: true
        type: string

      pairing_number:
        description: "WhatsApp Number to Pair (with country code)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dark-dila-pair
  cancel-in-progress: true

jobs:
  pairing:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    env:
      NODE_ENV: production
      OWNER_NUMBER: ${{ inputs.owner_number }}
      PAIRING_NUMBER: ${{ inputs.pairing_number }}
      MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
      MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate
        run: |
          test -n "$OWNER_NUMBER" || exit 1
          test -n "$PAIRING_NUMBER" || exit 1
          test -n "$MEGA_EMAIL" || exit 1
          test -n "$MEGA_PASSWORD" || exit 1
          echo "Configuration validated."

      - name: Start Pairing
        run: timeout 330m npm start
