
name: DARK DILA-MD PAIR SESSION

on:
  workflow_dispatch:
    inputs:
      PAIRING_NUMBER:
        description: "WhatsApp number with country code (without +)"
        required: true
        type: string

      BOT_OWNER:
        description: "Bot owner number"
        required: true
        type: string

      MEGA_EMAIL:
        description: "MEGA account email"
        required: true
        type: string

      MEGA_PASSWORD:
        description: "MEGA account password"
        required: true
        type: string

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      PAIRING_NUMBER: ${{ inputs.PAIRING_NUMBER }}
      BOT_OWNER: ${{ inputs.BOT_OWNER }}
      MEGA_EMAIL: ${{ inputs.MEGA_EMAIL }}
      MEGA_PASSWORD: ${{ inputs.MEGA_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Start DARK DILA-MD
        run: node index.js
